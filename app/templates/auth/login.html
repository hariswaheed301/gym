{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body p-4">
  <h1 class="h4 text-primary mb-1"><i class="bi bi-lightning-charge-fill"></i> {{ gym_name }}</h1>
  <p class="text-muted">Staff sign in</p>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    {{ field(form.username) }}
    {{ field(form.password) }}
    <button class="btn btn-primary w-100" type="submit">Sign in</button>
  </form>
</div></div>
{% endblock %}
