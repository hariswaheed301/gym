services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gym
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Optional: run the app in a container (`docker compose --profile app up`)
  web:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gym:${POSTGRES_PASSWORD}@db:5432/gym
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  pgdata:
